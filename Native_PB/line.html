<html>
<head>
<script type="text/javascript" src="https://www.google.com/jsapi"></script>
  <script src="../js/jquery.min.js" type="text/javascript"></script>
  <script type="text/javascript">
    google.load("visualization", "1", {packages:["corechart"]});
    google.setOnLoadCallback(function() {
        // Place init code here instead of $(document).ready()
  	drawChart();

    });

  function drawChart() {
       // Define the chart to be drawn.
     var data = new google.visualization.arrayToDataTable
([
 ['month', 'Mountain Bikes' ,  'Road Bikes', { role: 'annotation' } ] , 
 ['July' , 1067001.0404 , 730237.0061 , ''], 
 ['August' , 834874.7852 , 624496.2084 , ''], 
 ['September' , 1057441.3652 , 817755.3583 , ''], 
 ['October' , 1100038.8808 , 706901.4264 , ''], 
 ['November' , 798527.3021 , 623191.8716 , ''], 
 ['December' , 1045627.0517 , 842739.8649 , '']
]);

      // Set chart options
     var options = {
               title:'Total Sales of First Half Year',
               width:828,
               height:382,
               curveType: 'function',
               legend: { position: 'bottom' }
               };


     // Instantiate and draw the chart.
     var chart = new google.visualization.LineChart(document.getElementById("container"));
      chart.draw(data, options);

 }
</script>
</head>
<body>
    <div id = "container">
    </div>
</body>
